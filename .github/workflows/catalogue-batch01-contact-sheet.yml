name: Create batch 01 review contact sheet
on:
  push:
    branches: [feature/p7-sqlite-sandbox-20261102]
    paths:
      - '.github/workflows/catalogue-batch01-contact-sheet.yml'
      - 'tools/catalogue_batch01_contact_sheet.py'
permissions:
  contents: write
concurrency:
  group: rental-studio-batch01-contact
  cancel-in-progress: false
jobs:
  sheet:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Verify hashes and render image contact sheet
        run: python tools/catalogue_batch01_contact_sheet.py
      - name: Commit only generated research preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue_acquisition/batch01/CONTACT_SHEET.jpg
          if git diff --cached --quiet; then
            echo "Contact sheet already up to date."
          else
            git commit -m "docs(catalogue): add batch01 local photo contact sheet [skip ci]"
            git push origin HEAD:feature/p7-sqlite-sandbox-20261102
          fi
