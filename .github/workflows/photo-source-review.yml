name: Photo P1-B primary thumbnail review (never installed)

on:
  push:
    branches: [feature/p7-sqlite-sandbox-20261102]
    paths:
      - .github/workflows/photo-source-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install review-only tooling
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch bounded Commons thumbnails, never blocked originals
        run: |
          python - <<'PY'
          import hashlib
          import json
          import time
          from io import BytesIO
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote, urlparse
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps, ImageDraw, ImageFont

          source_dir = Path("design/photo_review")
          register = json.loads((source_dir / "PHOTO_P1_B_CANDIDATES_2026-11-03.json")
                                .read_text(encoding="utf-8"))
          output = source_dir / "review_output"
          output.mkdir(parents=True, exist_ok=True)
          primary_ids = ("corolla_2022", "ranger_harvey", "i20_calreyn",
                         "honda_chanokchon", "yamaha_packmeceng")
          entries = [item for candidate_id in primary_ids
                     for item in register["candidates"] if item["id"] == candidate_id]
          if len(entries) != 5 or len({e["model"] for e in entries}) != 5:
              raise SystemExit("Invalid source-page shortlist; exactly five distinct models required")

          items = []
          images = []
          blocked = False
          for entry in entries:
              record = {"id": entry["id"], "model": entry["model"],
                        "file_page": entry["url"],
                        "creator_from_existing_register": entry["author"],
                        "licence_from_existing_register": entry["license"],
                        "source_page_metadata_reverified": False,
                        "original_file_retrieved": False,
                        "approved": False}
              if blocked:
                  record["status"] = "SKIPPED_AFTER_HTTP_429"
                  items.append(record)
                  continue

              # One small, commonly served Commons thumbnail per candidate.
              # No original-file request, no fallback to original, no automatic
              # 429 retry, no concurrent downloads and no third-party hosts.
              filename = entry["file"].replace(" ", "_")
              encoded = quote(filename, safe="-._()")
              md5 = hashlib.md5(filename.encode("utf-8")).hexdigest()
              url = ("https://upload.wikimedia.org/wikipedia/commons/thumb/"
                     f"{md5[0]}/{md5[:2]}/{encoded}/640px-{encoded}")
              record["thumbnail_request_url"] = url
              try:
                  req = Request(url, headers={
                      "User-Agent": "RentalStudioPhotoReview/2.0 (https://github.com/Sonkhe-Shongwe/vehicle-rental-system; non-commercial candidate review)",
                      "Accept": "image/jpeg"
                  })
                  with urlopen(req, timeout=20) as response:
                      parsed = urlparse(response.geturl())
                      if parsed.scheme != "https" or parsed.hostname != "upload.wikimedia.org" or "/thumb/" not in parsed.path:
                          raise ValueError("Unexpected media redirect: no thumbnail accepted")
                      blob = response.read(4 * 1024 * 1024 + 1)
                  if not blob or len(blob) > 4 * 1024 * 1024:
                      raise ValueError("Thumbnail empty or larger than 4 MB")
                  with Image.open(BytesIO(blob)) as image:
                      image.verify()
                  with Image.open(BytesIO(blob)) as image:
                      image.load()
                      if image.format != "JPEG":
                          raise ValueError("Thumbnail is not JPEG")
                      im = ImageOps.exif_transpose(image).convert("RGB")
                  if not (320 <= im.width <= 640 and im.height > 160 and
                          im.width * im.height <= 700000):
                      raise ValueError(f"Unexpected thumbnail dimensions: {im.size}")
                  ow, oh = entry["dimensions"]
                  if abs(im.width / im.height - ow / oh) > 0.025:
                      raise ValueError("Thumbnail proportions differ from registered source")
                  stage_ratio = 380 / 136
                  aspect = im.width / im.height
                  retained = round(100 * min(aspect / stage_ratio,
                                             stage_ratio / aspect), 1)
                  record.update(status="THUMBNAIL_PREVIEW_ONLY",
                                thumbnail_sha256=hashlib.sha256(blob).hexdigest(),
                                thumbnail_bytes=len(blob),
                                thumbnail_dimensions=list(im.size),
                                registered_original_dimensions=[ow, oh],
                                centered_crop_area_retained_percent=retained)
                  images.append((entry, im, record))
                  print("PREVIEW", entry["id"], im.size, retained, flush=True)
                  time.sleep(3)  # avoid burst requests
              except HTTPError as error:
                  record.update(status="BLOCKED_HTTP_429" if error.code == 429 else "HTTP_ERROR",
                                error=f"HTTP {error.code}")
                  if error.code == 429:
                      blocked = True
                  print("STOP / UNAVAILABLE", entry["id"], record["error"], flush=True)
              except (URLError, TimeoutError, ValueError, OSError) as error:
                  record.update(status="UNAVAILABLE", error=str(error)[:240])
                  print("UNAVAILABLE", entry["id"], record["error"], flush=True)
              items.append(record)

          def framed(im, size, crop):
              if crop:
                  return ImageOps.fit(im, size, method=Image.Resampling.LANCZOS)
              pane = Image.new("RGB", size, "#EAF0F4")
              photo = ImageOps.contain(im, size, method=Image.Resampling.LANCZOS)
              pane.paste(photo, ((size[0] - photo.width) // 2,
                                 (size[1] - photo.height) // 2))
              return pane

          if images:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 15)
              heading = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 23)
              board = Image.new("RGB", (1120, 84 + len(images) * 215), "#F6F8FA")
              draw = ImageDraw.Draw(board)
              draw.text((18, 10), "Rental Studio | Source thumbnail crop comparison",
                        font=heading, fill="#17324D")
              draw.text((18, 47), "REVIEW ONLY | 640px thumbnail | no originals, approval or Qt asset changes",
                        font=font, fill="#0F766E")
              for i, (entry, im, info) in enumerate(images):
                  top = 84 + i * 215
                  draw.rounded_rectangle((8, top, 1110, top + 207),
                                         radius=10, fill="#FFFFFF", outline="#DCE4EB")
                  draw.text((18, top + 8), f'{entry["model"]} / {entry["id"]}',
                            font=font, fill="#17324D")
                  draw.text((18, top + 32), f'{entry["author"]} | {entry["license"]} (register only)',
                            font=font, fill="#0F766E")
                  board.paste(framed(im, (380, 136), False), (18, top + 58))
                  board.paste(framed(im, (380, 136), True), (413, top + 58))
                  draw.text((18, top + 195), "Contain: all of thumbnail",
                            font=font, fill="#17324D")
                  draw.text((413, top + 195),
                            f'Center crop: {info["centered_crop_area_retained_percent"]}% area retained',
                            font=font, fill="#17324D")
              board.save(output / "PRIMARY_FIVE_THUMBNAIL_CROP_REVIEW.png", "PNG",
                         optimize=True)

          complete = len(images) == len(entries)
          manifest = {"status": "UNAPPROVED_THUMBNAIL_REVIEW_ONLY",
                      "source_original_files_retrieved": 0,
                      "source_metadata_reverified_this_run": False,
                      "preview_count": len(images),
                      "expected_primary_count": 5,
                      "complete": complete,
                      "blocked_http_429": blocked,
                      "installed_application_assets": 0,
                      "notes": "Do not treat preview SHA-256 hashes as original source hashes; credits are sourced from the existing unapproved register. Must reverify metadata, source originals and owner visual approval before adoption.",
                      "files": items}
          (output / "SOURCE_REVIEW_MANIFEST.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8")
          (output / "CREDITS_AND_LIMITATIONS.md").write_text(
              "# Thumbnail review only\n\n"
              "No original media files fetched or bundled; no product asset modified.\n"
              "Creator/licence labels are from the existing source-page shortlist, "
              "not independently reverified in this workflow.\n"
              "CC BY-SA adaptations require attribution and share-alike review.\n"
              "See each source-page URL in SOURCE_REVIEW_MANIFEST.json.\n",
              encoding="utf-8")
          print(f"THUMBNAIL REVIEW {len(images)}/5; 429 blocked={blocked}", flush=True)
          if not complete:
              raise SystemExit("Incomplete thumbnail review; no photo may be approved")
          PY
      - name: Retain review evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-p1-b-primary-thumbnails-unapproved
          path: design/photo_review/review_output/
          if-no-files-found: warn
          retention-days: 14
