name: P2 Qt Quick native compile and runtime smoke

on:
  # Branch-scoped fallback if PR synchronize delivery is delayed.
  # Runs exactly the same native build, CTests and screenshot checks.
  push:
    branches:
      - spike/p2-qtquick-fleet-20261030
      # Scoped CI fallback for Q3 changes if PR events are not delivered.
      - feature/p7-sqlite-sandbox-20261102
    paths:
      - CMakeLists.txt
      - 'spikes/qtquick_p2/**'
      # Application-controller fixes and P3 regression tests must receive the
      # same native Windows/Linux checks even if PR synchronize is delayed.
      - 'src/application/**'
      - 'tests/p3_*.cpp'
      # Safety and recovery work in the opt-in SQLite test target also needs
      # native Windows/Linux checks, even when Qt Quick source is unchanged.
      - 'src/application/p7_sandbox/**'
      - 'tests/p7_sandbox/**'
      - '.github/workflows/p2-qtquick-review.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - docs/product-rebuild-reset-20261029
      # P3 is reviewed independently against the unmerged P2 source branch.
      - spike/p2-qtquick-fleet-20261030
      # Stacked P3-B draft review targets the unmerged P3-A branch.
      - feature/p3-typed-fleet-read-20261030
      # P3-C is a stacked draft review of the approved P3-B quote boundary.
      - feature/p3-rental-quote-20261030
      # P4 shared-shell draft PR is stacked on the accepted P3 branch.
      - feature/p3-rental-confirm-20261030
      # P5-A operational dashboard is stacked on the still-unmerged P4 draft.
      - feature/p4-shared-shell-focus-20261030
      - feature/p5-operational-overview-20261101
      # P7-B isolated storage review is stacked above the still-draft P6.
      - feature/p6-fleet-create-disposable-20261101
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-qtquick-${{ github.head_ref || github.ref_name }}
  # A later documentation-only update must not cancel an in-flight code validation.
  cancel-in-progress: false

jobs:
  scope:
    name: Inspect changed paths
    runs-on: ubuntu-24.04
    outputs:
      run_full: ${{ steps.paths.outputs.run_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and classify PR head delta
        id: paths
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_EVENT_ACTION: ${{ github.event.action }}
          CI_BEFORE: ${{ github.event.before }}
          CI_AFTER: ${{ github.event.after }}
        run: |
          python3 tests/ci_change_scope.py --self-test
          python3 tests/ci_change_scope.py --emit

  linux:
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    name: Qt 6.8.3 / Linux GCC / real QML smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++ cmake libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
      - name: Configure opt-in spike alongside legacy app
        run: cmake -S . -B build-p2 -G Ninja -DBUILD_TESTING=ON -DBUILD_QTQUICK_P2_SPIKE=ON -DBUILD_P7_SQLITE_SANDBOX=ON -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
      - name: Build unchanged legacy app and new QML executable
        run: cmake --build build-p2 --parallel 2
      - name: Run complete legacy + P2 native CTest
        run: ctest --test-dir build-p2 --output-on-failure
      - name: Upload real compiled QML screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-qtquick-linux-screenshots
          path: |
            build-p2/spikes/qtquick_p2/p2-qt-*.png
            build-p2/spikes/qtquick_p2/p3-qt-rentals-*.png
            build-p2/spikes/qtquick_p2/p4-qt-shared-focus-*.png
            build-p2/spikes/qtquick_p2/p4-qt-shared-components-*.png
            build-p2/spikes/qtquick_p2/p4-qt-focus-route-*.png
            build-p2/spikes/qtquick_p2/p4-qt-motion-*.png
            build-p2/spikes/qtquick_p2/p5-qt-operational-overview-*.png
            build-p2/spikes/qtquick_p2/p5-qt-booking-receipt-*.png
            build-p2/spikes/qtquick_p2/p5-qt-persistent-*.png
            build-p2/spikes/qtquick_p2/p5-qt-fleet-booking-receipt-*.png
            build-p2/spikes/qtquick_p2/p5-qt-cancel-outcome-*.png
            build-p2/spikes/qtquick_p2/p6-qt-archived-delete-*.png
            build-p2/spikes/qtquick_p2/ux-q3-*.png
            build-p2/spikes/qtquick_p2/ux-s1-rentals-bottom-*.png
          if-no-files-found: ignore
          retention-days: 7

  windows:
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    name: Qt 6.8.3 / Windows MSVC / real QML smoke
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      # Native Windows QPA exposes the Windows font database; the offscreen
      # plugin had rendered every Latin label as empty tofu squares.
      QT_QPA_PLATFORM: windows
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Configure on exact Qt kit
        shell: pwsh
        run: |
          cmake -S . -B build-p2 -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DBUILD_QTQUICK_P2_SPIKE=ON -DBUILD_P7_SQLITE_SANDBOX=ON "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unchanged legacy app and new Qt Quick executable
        shell: pwsh
        run: |
          cmake --build build-p2 --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set large virtual display for true 1500x860 and 1280x720 captures
        shell: pwsh
        run: |
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force
          } else {
            Write-Warning "Set-DisplayResolution unavailable; exact screenshot-size CTests must still pass."
          }
      - name: Run complete CTest with hosted Windows native-QPA UI checks
        shell: pwsh
        run: |
          ctest --test-dir build-p2 -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create disposable on-device Windows P2 acceptance kit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "build-p2/spikes/qtquick_p2/Release/rental_studio_qtquick_spike.exe"
          if (-not (Test-Path $exe)) { throw "Native Windows P2 executable missing" }
          $dest = "build-p2/p2-windows-physical-acceptance-kit"
          New-Item -ItemType Directory -Path "$dest/demo" -Force | Out-Null
          Copy-Item $exe "$dest/RentalStudioP2Review.exe"
          Copy-Item "demo/vehicles.txt" "$dest/demo/vehicles.txt"
          Copy-Item "demo/rentals.txt" "$dest/demo/rentals.txt"
          Copy-Item "spikes/qtquick_p2/Verify-P2-Windows.ps1" "$dest/Verify-P2-Windows.ps1"
          Copy-Item "spikes/qtquick_p2/WINDOWS_PHYSICAL_ACCEPTANCE.md" "$dest/WINDOWS_PHYSICAL_ACCEPTANCE.md"
          Copy-Item "spikes/qtquick_p2/Launch-Rental-Studio.cmd" "$dest/Launch-Rental-Studio.cmd"
          Copy-Item "spikes/qtquick_p2/Check-Rental-Studio.cmd" "$dest/Check-Rental-Studio.cmd"
          Copy-Item "spikes/qtquick_p2/START_HERE_FUNCTIONAL_DEMO.md" "$dest/START_HERE_FUNCTIONAL_DEMO.md"
          Copy-Item "spikes/qtquick_p2/Verify-P4-Windows.ps1" "$dest/Verify-P4-Windows.ps1"
          Copy-Item "spikes/qtquick_p2/P4_WINDOWS_ACCESSIBILITY_ACCEPTANCE.md" "$dest/P4_WINDOWS_ACCESSIBILITY_ACCEPTANCE.md"
          Set-Content -Path "$dest/SOURCE_COMMIT.txt" -NoNewline -Value "$env:GITHUB_SHA"
          $deployer = Join-Path $env:QT_ROOT_DIR "bin/windeployqt.exe"
          if (-not (Test-Path $deployer)) { throw "windeployqt unavailable" }
          # This is a QA kit, not a redistributable installer. Microsoft VC++
          # runtime must come from the official installer, not copied raw.
          & $deployer --release --no-compiler-runtime --qmldir "spikes/qtquick_p2" "$dest/RentalStudioP2Review.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed: $LASTEXITCODE" }
          $stageExe = (Resolve-Path "$dest/RentalStudioP2Review.exe").Path
          # Test relocation in a package-only directory before uploading.
          $original = [System.IO.File]::ReadAllBytes((Resolve-Path "$dest/demo/vehicles.txt").Path)
          try {
            [System.IO.File]::AppendAllText((Resolve-Path "$dest/demo/vehicles.txt").Path, "`nUNTRUSTED")
            & $stageExe --self-test
            if ($LASTEXITCODE -eq 0) { throw "Tampered source fixture unexpectedly accepted" }
            Write-Host "Expected non-demo fixture rejection observed"
          } finally {
            [System.IO.File]::WriteAllBytes((Resolve-Path "$dest/demo/vehicles.txt").Path, $original)
          }
          # The same one-click manual launcher must also work in a safe
          # non-GUI --verify mode against packaged, SHA-pinned fixture bytes.
          & "$dest/Launch-Rental-Studio.cmd" --verify
          if ($LASTEXITCODE -ne 0) { throw "Packaged fictional launcher verification failed: $LASTEXITCODE" }
          # FUNC-D2: run a user-repeatable, fully packaged, exact-source
          # native fictional lifecycle check, with QTemporaryDir cleanup.
          & "$dest/Check-Rental-Studio.cmd"
          if ($LASTEXITCODE -ne 0) { throw "Packaged functionality check failed: $LASTEXITCODE" }
          $reports = @(Get-ChildItem -LiteralPath $dest -Directory -Filter "functional-check-evidence-*")
          if ($reports.Count -ne 1 -or -not (Select-String -Path (Join-Path $reports[0].FullName "RESULTS.txt") -Pattern "^FINAL: PASS - all eight checks exited 0$" -Quiet)) {
            throw "Package checker did not produce eight all-PASS native results"
          }
          Write-Host "FUNC-D2 eight packaged functional checks PASS"
          # Avoid uploading runner-local log paths or any diagnostics.
          Remove-Item -LiteralPath $reports[0].FullName -Recurse -Force
          & "$dest/Verify-P2-Windows.ps1" -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw "Packaged real Qt P2 verification failed" }
          # Run P4 accessibility/focus/motion checks against the relocated
          # packaged executable, not just its CTest build-tree version.
          & "$dest/Verify-P4-Windows.ps1" -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw "Packaged real Qt P4 verification failed (PowerShell 7)" }
          # Regression for owner's actual Windows PowerShell 5.1 host:
          # Qt qInfo() writes PASS to native stderr. Confirm this is NOT
          # confused with a terminating NativeCommandError under PS 5.1.
          # This override is scoped to the CI child process, never systemwide.
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$dest/Verify-P4-Windows.ps1" -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw "Packaged P4 Windows PowerShell 5.1 verification failed: $LASTEXITCODE" }
          Write-Host "P4 Windows PowerShell 5.1 subprocess verification PASS"
          # Do not bundle runner-specific test outputs or host diagnostics.
          Remove-Item "$dest/acceptance-evidence" -Recurse -Force -ErrorAction SilentlyContinue
      - name: Upload disposable Windows P2 physical acceptance kit
        uses: actions/upload-artifact@v4
        with:
          name: p2-windows-physical-acceptance-kit
          path: build-p2/p2-windows-physical-acceptance-kit/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload real compiled QML screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-qtquick-windows-screenshots
          path: |
            build-p2/spikes/qtquick_p2/p2-qt-*.png
            build-p2/spikes/qtquick_p2/p3-qt-rentals-*.png
            build-p2/spikes/qtquick_p2/p4-qt-shared-focus-*.png
            build-p2/spikes/qtquick_p2/p4-qt-shared-components-*.png
            build-p2/spikes/qtquick_p2/p4-qt-focus-route-*.png
            build-p2/spikes/qtquick_p2/p4-qt-motion-*.png
            build-p2/spikes/qtquick_p2/p5-qt-operational-overview-*.png
            build-p2/spikes/qtquick_p2/p5-qt-booking-receipt-*.png
            build-p2/spikes/qtquick_p2/p5-qt-persistent-*.png
            build-p2/spikes/qtquick_p2/p5-qt-fleet-booking-receipt-*.png
            build-p2/spikes/qtquick_p2/p5-qt-cancel-outcome-*.png
            build-p2/spikes/qtquick_p2/p6-qt-archived-delete-*.png
            build-p2/spikes/qtquick_p2/ux-q3-*.png
            build-p2/spikes/qtquick_p2/ux-s1-rentals-bottom-*.png
          if-no-files-found: ignore
          retention-days: 7
