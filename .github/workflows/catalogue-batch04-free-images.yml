name: Acquire free vehicle images batch 04
on:
  push:
    branches: [feature/p7-sqlite-sandbox-20261102]
    paths:
      - '.github/workflows/catalogue-batch04-free-images.yml'
      - 'catalogue_acquisition/batch04/sources.json'
      - 'tools/acquire_catalogue_batch04.py'
      - 'tools/catalogue_batch04_contact_sheet.py'
permissions:
  contents: write
concurrency:
  group: rental-studio-catalogue-batch04
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install --quiet pillow
      - name: Verify acquisition and preview Python syntax
        run: python -m py_compile tools/acquire_catalogue_batch04.py tools/catalogue_batch04_contact_sheet.py
      - name: Acquire and licence-check 10 Commons images
        run: python tools/acquire_catalogue_batch04.py
      - name: Generate contact sheet from sha256-checked acquired photos
        run: python tools/catalogue_batch04_contact_sheet.py
      - name: Commit research assets only, never the Qt image map
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue_acquisition/batch04/images catalogue_acquisition/batch04/IMAGE_CREDITS.md catalogue_acquisition/batch04/source_manifest.json catalogue_acquisition/batch04/CONTACT_SHEET.jpg
          if git diff --cached --quiet; then
            echo "Photo research assets unchanged."
          else
            git commit -m "assets(catalogue): stage ten licensed batch04 car photos [skip ci]"
            git push origin HEAD:feature/p7-sqlite-sandbox-20261102
          fi
