name: Offline Fleet photo candidate preflight (synthetic only)

on:
  push:
    branches:
      - feature/p7-sqlite-sandbox-20261102
    paths:
      - tools/offline_photo_review.py
      - tests/test_offline_photo_review.py
      - .github/workflows/photo-offline-review.yml
      - design/photo_review/OFFLINE_REVIEW_INPUT_TEMPLATE.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    name: Offline synthetic preflight / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image decoder for synthetic fixtures only
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Run offline generated-image preflight tests
        run: python -m unittest discover -s tests -p 'test_offline_photo_review.py' -v
      - name: Check usage without any source retrieval
        run: python tools/offline_photo_review.py --help