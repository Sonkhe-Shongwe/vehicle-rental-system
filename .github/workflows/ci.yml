name: C++ Qt build and domain tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev cmake ninja-build g++
      - name: Check public fixtures
        run: python3 tests/test_repo_hygiene.py
      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: CTest
        run: ctest --test-dir build --output-on-failure
